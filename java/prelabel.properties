# 预标注配置；相对路径相对于本文件所在目录

# 图片 URL 列表：每行一个，空行和 # 开头的行忽略，重复 URL 只处理一次
input=urls.txt
# 每次运行在其下新建 yyyyMMdd_HHmmss 子目录
output.dir=../raw/prelabel
# 成功得到多少份（图片 + 标签）后停止
target=500
# 下载并发线程数
threads=8

# 推理引擎：ort（ONNX Runtime，默认）| opencv（原 OpenCV DNN 实现）
engine=ort
# ort 建议用动态尺寸模型（scripts/export_onnx.py --dynamic 导出）；固定尺寸模型会退回 letterbox
model=../weights/qrcode_yolo26x_ft2_dynamic.onnx
# 预标注阈值；比线上低一些可以把低分框也标出来供人工确认
conf=0.25

# ---- ort ----
# 原图放大倍数：小码（30~40px）需要 1.25 以上才稳定检出
scale=1.28
# 单次推理输入长边上限，长边 × scale 超过它时自动切块
max.side=1600
# 自动切块时相邻块最少重叠的原图像素，需大于小码尺寸
overlap.px=128
# 单次推理线程数，0 为全部核；下载并发 threads 较大时可设 2~4，避免多张图同时推理抢核
model.threads=0

# ---- opencv（engine=opencv 时生效）----
# 模型实例数：每个实例单独占一份模型内存（x 约 220MB），一般 2~4
model.instances=2
# 切图检测：切块边长，0 关闭；切块与整图都会缩放到 640
tile=0
overlap=0.25
# 没有检测到任何框的图是否保留（写空标签并计入 target）；漏检样本往往最有价值，建议保留
keep.empty=true

connect.timeout.ms=5000
read.timeout.ms=15000
# 单张图片最大字节数
max.bytes=20971520
